<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LoopStruck</title>
    <style>
      /* --- GLOBAL STYLES --- */
      body { 
        margin: 0; 
        padding: 0; 
        background-color: #1a1a1a; 
        color: white; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden; /* Prevent scrolling */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
      }

      /* --- GAME CONTAINER (Desktop Default: 400x600) --- */
      #unity-container { 
        width: 400px; 
        height: 600px; 
        position: relative; 
        background: #000; 
        box-shadow: 0px 0px 20px rgba(0,0,0,0.5); 
      }

      #unity-canvas { 
        width: 100%; 
        height: 100%; 
        background: #231F20; 
        display: block;
      }

      /* --- MOBILE OVERRIDE: Full Screen on Phones --- */
      @media screen and (max-width: 600px), screen and (max-height: 600px) {
        #unity-container {
          width: 100% !important;
          height: 100% !important;
          box-shadow: none; /* Remove shadow on mobile for clean look */
        }
      }

      /* --- LOADING SCREEN OVERLAY --- */
      #loading-cover {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: #0d1117; 
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        transition: opacity 0.5s ease-out; 
      }

      /* --- BOUNCY ICON ANIMATION --- */
      .bouncy-icon {
        width: 60px;  /* Small size as requested */
        height: 60px;
        background-image: url('loading_icon.png'); /* Your new camera icon */
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        margin-bottom: 25px;
        
        /* Loop: Bouncy animation */
        animation: bounce 0.8s infinite ease-in-out; 
      }

      @keyframes bounce {
        0%, 100% { 
          transform: translateY(0); 
        }
        50% { 
          transform: translateY(-15px); /* The hop */
        }
      }

      /* --- PROGRESS BAR --- */
      .progress-container {
        width: 70%;
        max-width: 300px; /* Limit width on big screens */
        height: 8px;
        background-color: #333;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      .progress-bar {
        width: 0%; 
        height: 100%;
        background-color: #00AEEF; 
        transition: width 0.2s;
      }

      /* --- TEXT STYLES --- */
      .loading-text {
        font-size: 14px;
        color: #fff;
        font-weight: bold;
        letter-spacing: 0.5px;
      }

      .time-text {
        margin-top: 5px;
        font-size: 11px;
        color: #888;
        font-style: italic;
      }

    </style>
  </head>
  <body>

    <div id="unity-container">
      <canvas id="unity-canvas" width=400 height=600></canvas>

      <div id="loading-cover">
        <div class="bouncy-icon"></div>
        
        <div class="progress-container">
          <div id="progress-bar-fill" class="progress-bar"></div>
        </div>
        
        <div id="progress-text" class="loading-text">LOADING... 0%</div>
        <div id="time-text" class="time-text">Calculating time...</div>
      </div>

    </div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingCover = document.querySelector("#loading-cover");
      var progressBarFill = document.querySelector("#progress-bar-fill");
      var progressText = document.querySelector("#progress-text");
      var timeText = document.querySelector("#time-text");

      // --- MOBILE DEVICE CHECK ---
      // We check if the user is on mobile to enforce fullscreen logic if needed
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Optional: Force config to not run in background if needed
        // config.devicePixelRatio = 1; 
      }

      // --- TIME ESTIMATION VARIABLES ---
      var startTime = Date.now();
      var lastProgress = 0;

      createUnityInstance(canvas, config, (progress) => {
        
        // 1. UPDATE BAR & PERCENTAGE
        progressBarFill.style.width = (100 * progress) + "%";
        var percent = Math.round(progress * 100);
        progressText.innerHTML = "LOADING... " + percent + "%";

        // 2. CALCULATE ESTIMATED TIME
        if (progress > 0.01 && progress < 1.0) {
            var currentTime = Date.now();
            var elapsedTime = (currentTime - startTime) / 1000; 

            // Formula: Estimated Total Time = Elapsed / Current Progress
            var estimatedTotalTime = elapsedTime / progress;
            var remainingTime = estimatedTotalTime - elapsedTime;

            remainingTime = Math.round(remainingTime * 10) / 10;

            if (remainingTime < 60) {
               timeText.innerHTML = "Est. Time: " + remainingTime + "s";
            } else {
               var mins = Math.floor(remainingTime / 60);
               timeText.innerHTML = "Est. Time: " + mins + "m " + Math.round(remainingTime % 60) + "s";
            }
        } else if (progress >= 1.0) {
            timeText.innerHTML = "Almost there...";
        }

      }).then((unityInstance) => {
        
        // --- LOAD COMPLETE ---
        loadingCover.style.opacity = 0;
        setTimeout(() => {
          loadingCover.style.display = "none";
        }, 500);

      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
